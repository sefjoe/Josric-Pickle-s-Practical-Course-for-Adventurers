name: Install approved maps

on:
  push:
    paths:
      - '.approved-map-upload/final_room.b64'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved maps and update 5eTools
        run: |
          python <<'PY'
          import base64
          from pathlib import Path

          names = [
              'base_library_room',
              'book_mimic_room',
              'book_puzzle_room',
              'reinforced_door_room',
              'librarian_room',
              'teamwork_room',
              'mirror_gallery',
              'final_room',
          ]
          Path('maps').mkdir(exist_ok=True)
          for name in names:
              b64 = Path(f'.approved-map-upload/{name}.b64').read_text(encoding='utf-8').strip()
              Path(f'maps/{name}.jpg').write_bytes(base64.b64decode(b64))

          p = Path('Josric_Pickle_Practical_Course_for_Adventurers_5etools.json')
          text = p.read_text(encoding='utf-8')
          for name in names:
              text = text.replace(f'/maps/{name}.svg', f'/maps/{name}.jpg')
          p.write_text(text, encoding='utf-8')

          r = Path('README.md')
          rt = r.read_text(encoding='utf-8')
          note = '\n\n## Approved map set\n\nThe 5eTools JSON references the approved raster map set in `maps/*.jpg`; the earlier SVG recreations are no longer used.\n'
          if '## Approved map set' not in rt:
              rt += note
          r.write_text(rt, encoding='utf-8')
          PY
          rm -f maps/*.svg
          rm -rf .approved-map-upload
          rm -f .github/workflows/install-approved-maps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use approved map set in 5eTools"
          git push

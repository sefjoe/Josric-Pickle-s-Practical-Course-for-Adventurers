<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<title>Base Library Room</title>
<desc>Top-down grid battlemat for Josric Pickle's Practical Course for Adventurers.</desc>
<defs>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="50" height="50" fill="#d7c7a6"/>
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#8f8067" stroke-width="1" opacity=".55"/>
  </pattern>
  <pattern id="stone" width="28" height="18" patternUnits="userSpaceOnUse">
    <rect width="28" height="18" fill="#68635b"/>
    <path d="M0 9h28M14 0v9M7 9v9M21 9v9" stroke="#4c4842" stroke-width="1"/>
  </pattern>
  <linearGradient id="wood" x1="0" x2="1">
    <stop offset="0" stop-color="#654224"/><stop offset=".5" stop-color="#8a5d31"/><stop offset="1" stop-color="#5c3a20"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" x2="1">
    <stop offset="0" stop-color="#777"/><stop offset=".5" stop-color="#bbb"/><stop offset="1" stop-color="#666"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1100" height="800" fill="#2f2c28"/>
<rect x="50" y="50" width="1000" height="700" rx="8" fill="url(#grid)"/>
<path d="M50 50H475 M625 50H1050 V750 H625 M475 750H50Z" fill="none" stroke="url(#stone)" stroke-width="32" stroke-linecap="square"/>
<path d="M50 50V750 M1050 50V750" fill="none" stroke="url(#stone)" stroke-width="32"/>

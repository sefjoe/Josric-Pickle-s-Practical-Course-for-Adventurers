name: Apply v1.5 table-use updates

on:
  push:
    paths:
      - '.github/workflows/apply-v1-5.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v1.5 update
        run: python tools/apply_v1_5.py

      - name: Validate JSON
        run: python -m json.tool Josric_Pickle_Practical_Course_for_Adventurers_5etools.json > /dev/null

      - name: Commit v1.5 and clean temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf tools .github
          git add -A
          git commit -m "Update adventure to v1.5 table-ready guidance"
          git push

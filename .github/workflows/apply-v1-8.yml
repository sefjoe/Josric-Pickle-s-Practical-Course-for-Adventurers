name: Apply v1.8 initiative-ready creature update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-8.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply JSON update
        run: python tools/update_v1_8.py
      - name: Validate JSON
        run: python -m json.tool Josric_Pickle_Practical_Course_for_Adventurers_5etools.json > /dev/null
      - name: Commit update and remove one-time tooling
        run: |
          rm -f tools/update_v1_8.py .github/workflows/apply-v1-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update adventure to v1.8 initiative-ready creatures"
          git push

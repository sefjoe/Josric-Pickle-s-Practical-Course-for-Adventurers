name: Install approved JPTC maps

on:
  push:
    paths:
      - '.approved-map-upload/final_room.b64'
      - '.github/workflows/install-approved-maps.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install approved maps and update 5eTools references
        run: |
          python <<'PY'
          import base64
          import json
          import time
          from pathlib import Path

          names = [
              'base_library_room',
              'book_mimic_room',
              'book_puzzle_room',
              'reinforced_door_room',
              'librarian_room',
              'teamwork_room',
              'mirror_gallery',
              'final_room',
          ]

          image_dir = Path('img/adventure/JPTC')
          image_dir.mkdir(parents=True, exist_ok=True)
          for name in names:
              b64 = Path(f'.approved-map-upload/{name}.b64').read_text(encoding='utf-8').strip()
              (image_dir / f'{name}.jpg').write_bytes(base64.b64decode(b64))

          json_path = Path('Josric_Pickle_Practical_Course_for_Adventurers_5etools.json')
          data = json.loads(json_path.read_text(encoding='utf-8'))
          data['_meta']['dateLastModified'] = int(time.time())

          filename_by_title = {
              'Base Library Room': 'base_library_room.jpg',
              'Book Mimic Room': 'book_mimic_room.jpg',
              'Book Puzzle Room': 'book_puzzle_room.jpg',
              'Reinforced Door Room': 'reinforced_door_room.jpg',
              'Librarian Room': 'librarian_room.jpg',
              'Teamwork Room': 'teamwork_room.jpg',
              'Mirror Gallery': 'mirror_gallery.jpg',
              'Final Room': 'final_room.jpg',
          }

          def walk(obj):
              if isinstance(obj, dict):
                  if obj.get('type') == 'image' and obj.get('title') in filename_by_title:
                      obj['href'] = {
                          'type': 'internal',
                          'path': f"adventure/JPTC/{filename_by_title[obj['title']]}"
                      }
                  for value in obj.values():
                      walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(data)
          json_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = '## Approved map set'
          if marker in readme:
              readme = readme.split(marker)[0].rstrip()
          readme += '''\n\n## Approved map set\n\nThe adventure uses the approved raster map set packaged in `img/adventure/JPTC/`, following the same internal-image pattern used by No Cause for Alarm. The 5eTools JSON references these as internal paths such as `adventure/JPTC/book_mimic_room.jpg`. The earlier SVG recreations are no longer used.\n'''
          readme_path.write_text(readme, encoding='utf-8')
          PY

          rm -rf maps
          rm -rf .approved-map-upload
          rm -f .github/workflows/install-approved-maps.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Package approved maps like NCFA"
          git push

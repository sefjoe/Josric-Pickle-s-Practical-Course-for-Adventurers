name: Apply v1.6 adventure refinements

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-v1-6.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6 JSON and README updates
        run: |
          python <<'PY'
          import json
          import time
          from pathlib import Path

          path = Path('Josric_Pickle_Practical_Course_for_Adventurers_5etools.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          data['_meta']['sources'][0]['version'] = '1.6'
          data['_meta']['dateLastModified'] = int(time.time())

          root_entries = data['adventureData'][0]['data'][0]['entries']
          by_id = {entry.get('id'): entry for entry in root_entries if isinstance(entry, dict)}

          # Running the Three-Hour Session: keep the valves flexible and table-aware.
          pacing = by_id['003']
          for entry in pacing['entries']:
              if isinstance(entry, dict) and entry.get('name') == 'Optional-Room Pacing':
                  entry['entries'] = [
                      'Behind schedule: skip both optional rooms and go directly from the Unlocked Door to the Mirror Gallery.',
                      'On pace: usually continue to the Mirror Gallery. Use one optional room only if the table is moving briskly and the session would benefit from a change of activity.',
                      'Ahead: choose the Librarian if the table needs an NPC/social scene, or Teamwork if the table has already been talk-heavy and would benefit from a physical cooperative challenge.',
                      'Far ahead: run both optional rooms, using as many Teamwork door pairs as the remaining clock supports.'
                  ]

          # Room 2: symbol clue on the DM screen, title-only books, door symbols as progress feedback.
          room2 = by_id['007']
          room2_image = room2['entries'][0]
          room2['entries'] = [
              room2_image,
              {
                  'type': 'entries',
                  'name': 'Terrain Setup',
                  'entries': [
                      'Use the standard repeated library layout.',
                      'Treat the north large bookcase as the puzzle shelf. Place six simple title cards at or in front of the shelf to represent the six distinctive books. The title cards have no symbols.',
                      'Prepare three large clue cards showing an Eye, a Head, and an open Hand. Hang them in that order from the player-facing side of the DM screen when the party enters the room.',
                      'Keep the north door physically in its normal location; it remains sealed until the room is solved.'
                  ]
              },
              'The exit is sealed. Above the prominent puzzle shelf are three symbols in order: {@b Eye → Head → Hand}. At the table, the three clue cards hanging from the DM screen represent these symbols.',
              'Six distinctive books are displayed on the shelf. They are identified only by their titles; there are no matching symbols printed on the books.',
              {
                  'type': 'entries',
                  'name': 'The Six Books',
                  'entries': [
                      {
                          'type': 'list',
                          'items': [
                              '{@i The Watchful Adventurer}',
                              '{@i Problems Best Solved by Steel}',
                              '{@i A Manual of Practical Methods}',
                              '{@i On Thought Before Action}',
                              '{@i A Survey of Roads and Ruins}',
                              '{@i Courage in the Face of Certain Doom}'
                          ]
                      },
                      'The titles are the choices. The players must interpret the three clue symbols and connect each idea to the appropriate title.'
                  ]
              },
              'The intended sequence is {@i The Watchful Adventurer} → {@i On Thought Before Action} → {@i A Manual of Practical Methods}: Eye suggests watching, Head suggests thought, and Hand suggests practical action.',
              {
                  'type': 'entries',
                  'name': 'Door Progress',
                  'entries': [
                      'When the correct first book is chosen, an Eye symbol silently appears on the sealed north door.',
                      'When the correct second book is chosen, a Head symbol silently appears beside the Eye.',
                      'When the correct third book is chosen, a Hand symbol silently appears beside the others. With Eye → Head → Hand complete, the north door opens.',
                      'Do not add a click, glow from the book, or other mechanical confirmation. The symbol appearing on the door is the feedback.'
                  ]
              },
              'A wrong choice causes a harmless magical response and clears every progress symbol from the door, resetting the sequence. Use funny or curious effects—a bell, a puff of dust, a book briefly scolding the character—rather than damage.',
              'Investigation, Arcana, Detect Magic, Mage Hand, tools, physical experimentation, or another sensible method can reveal or bypass parts of the puzzle. Reward workable solutions instead of protecting the intended sequence.',
              'If the table has been genuinely stuck for about 7–8 minutes, let Josric\'s magic provide a small hint rather than allowing the room to become a bottleneck.',
              'The lesson is: {@b A good adventurer uses more than weapons to succeed.}',
              'When solved, the second required Lesson Marker appears: {@b YOUR STUDENTS}.',
              'The north door opens.'
          ]

          # Room 3: keep the handle visible, but do not make it the punchline of the description list.
          room3 = by_id['008']
          for entry in room3['entries']:
              if isinstance(entry, dict) and entry.get('name') == 'Describe the Door':
                  for sub in entry['entries']:
                      if isinstance(sub, dict) and sub.get('type') == 'list':
                          sub['items'] = [
                              'The door itself is faced in dark steel and looks far heavier than the other doors in the course.',
                              'Six different keyholes are arranged at different heights, none using the same shape of key.',
                              'A completely ordinary brass handle sits at normal hand height. It is unobstructed.',
                              'Three numbered combination dials sit in a brass plate near the center.',
                              'Two recessed sliding bolts disappear into the stone wall on either side.',
                              'A ring of faint arcane-looking runes circles the frame.',
                              'A narrow inspection slot is covered by a tiny hinged plate.',
                              'Several old scratches around the locks suggest that somebody has tried to pick them before.'
                          ]

          # Librarian: make her objective clear without revealing the solution.
          librarian = by_id['009']
          needle = 'A magical Librarian blocks passage and states that the party is not authorized to enter the restricted collection.'
          idx = librarian['entries'].index(needle)
          if not any(isinstance(x, dict) and x.get('type') == 'quote' and x.get('entries') == ['State your authorization.'] for x in librarian['entries']):
              librarian['entries'].insert(idx + 1, {'type': 'quote', 'entries': ['State your authorization.']})

          # Mirror Gallery: establish source relationship visually, then make the first discovery unmistakable.
          mirrors = by_id['011']
          for i, entry in enumerate(mirrors['entries']):
              if entry == 'One standing mirror appears for each PC. Each mirror produces an Echo that looks exactly like that character but uses a simple prebuilt class-themed monster card rather than a copied character sheet.':
                  mirrors['entries'][i] = 'One standing mirror appears for each PC. When the encounter begins, each Echo visibly peels or steps out of its specific standing mirror, looking exactly like that character but using a simple prebuilt class-themed monster card rather than a copied character sheet.'
              if entry == 'Destroying a mirror immediately destroys its linked Echo. This is an intended solution, not an exploit.':
                  mirrors['entries'][i] = 'Destroying a mirror immediately destroys its linked Echo. The first time this happens, describe the glass breaking and the linked Echo cracking in the same pattern at the same instant before shattering into magical fragments. Once the party discovers the relationship, do not obscure it. This is an intended solution, not an exploit.'

          # Recovery: preserve RAW explanation but keep the table procedure moving.
          recovery = by_id['012']
          guidance = 'Table procedure: once the players understand the station, move quickly from character to character. Have a character roll 2d8 + 3; if they are still below 75 percent of maximum HP, roll again. Preserve the normal spell effects, but do not turn repeated uses into a long accounting scene.'
          if guidance not in recovery['entries']:
              recovery['entries'].append(guidance)

          # Final Exam: explicit objective and visual distinction from Mirror Gallery.
          final_exam = by_id['014']
          quote = {'type': 'quote', 'entries': ['Final lesson. Defeat me.']}
          if quote not in final_exam['entries']:
              final_exam['entries'].insert(1, quote)
              final_exam['entries'].insert(2, 'When the starting Reflection or Reflections appear, they split directly out of Josric—his shadow, arcane aura, or silhouette pulling free and taking form. Later Reflections manifest the same way. No standing mirror creates them.')
          for entry in final_exam['entries']:
              if isinstance(entry, dict) and entry.get('name') == 'No Mirror Shortcut in the Final Exam':
                  entry['entries'] = [
                      'The final Josric Reflections are direct magical projections of Josric. They visibly split from him and are not linked to physical standing mirrors.',
                      'There are no mirror objects to smash in this encounter. Breaking a mirror from the earlier room cannot affect them.',
                      'The intended shortcut in the finale is recognizing the real objective: defeating or forcing Josric to yield immediately ends every remaining Reflection and Mimic.'
                  ]

          # DM Quick Reference: add the accepted v1.6 table-use reminders.
          quick = by_id['017']
          for entry in quick['entries']:
              if isinstance(entry, dict) and entry.get('name') == 'New Table Aids':
                  entry['entries'] = [
                      'Room 2 uses Eye → Head → Hand clue cards on the DM screen and title-only book cards at the shelf; correct choices make the symbols appear on the exit door in sequence.',
                      'Room 3 has a bullet-list door description with the ordinary handle mixed into the middle rather than saved as the final clue.',
                      'The Librarian opens with “State your authorization.” and has full appearance plus Search, Study, Help, Utilize, Dodge, and Ready guidance using 2024 actions.',
                      'Teamwork mechanisms include suggested DCs plus RAW-style object AC/HP.',
                      'Mirror Echoes visibly emerge from their source mirrors; add one Standing Mirror (Echo Source) tracker row per PC.',
                      'The recovery station uses stored Cure Wounds and Lesser Restoration effects; once understood, resolve repeated healing quickly.',
                      'Final Reflection order: Martial at start, Magic in the later wave, plus Support at the 6-player start.',
                      'Final Reflections split directly from Josric, have no breakable mirror source, and Josric states the objective: “Final lesson. Defeat me.”'
                  ]

          # Designer's Notes for Grayson: preserve the evolution of Room 2 and add table-energy pacing advice.
          notes = by_id['018']
          for entry in notes['entries']:
              if isinstance(entry, dict) and entry.get('name') == 'Room 2: The Book Puzzle':
                  entry['entries'] = [
                      'I wanted a room that could not be solved by just attacking it. The lesson became that a good adventurer uses more than weapons.',
                      'I was initially worried that a puzzle needed to be difficult to be worthwhile. I eventually went the other direction.',
                      'The early version literally said SEE, THINK, ACT and matched those words to Eye, Head, and Hand. During later playtesting I realized that was almost giving the answer away.',
                      'I changed the clue to three symbols—Eye, Head, Hand—and removed symbols from the books. The books are identified only by their titles, so the players have to make one real conceptual connection without the puzzle becoming obscure.',
                      'As they choose correctly, the same symbols appear on the door one at a time. A wrong answer harmlessly resets the sequence. I wanted experimentation to give useful feedback without punishing the players for trying.'
                  ]

          pacing_note = {
              'type': 'entries',
              'name': 'Choosing the Optional Rooms',
              'entries': [
                  'Grayson, the Librarian and Teamwork rooms are both optional, but they are not interchangeable filler.',
                  'When you reach the end of the Unlocked Door, pay attention to the table instead of only the clock.',
                  'If the players are ahead on time and they have not had much opportunity to talk, roleplay, or interact with an NPC, use the Librarian.',
                  'If they are ahead but they have already spent plenty of time talking and roleplaying, use the Teamwork room instead. It changes the energy of the game and gives them something physical and cooperative to solve.',
                  'If they are far ahead, you can use both.',
                  'If they are on schedule or running behind, you can skip both.',
                  'The important thing is that pacing is not only about minutes. It is also about what the players have been doing. If they have been talking for twenty minutes, give them something to do. If they have been fighting and solving mechanisms for an hour, give them somebody interesting to talk to.',
                  'You do not have to run every room I wrote. Choosing not to use a room because the session does not need it is part of DMing the adventure well.'
              ]
          }
          if not any(isinstance(x, dict) and x.get('name') == 'Choosing the Optional Rooms' for x in notes['entries']):
              pacing_index = next(i for i, x in enumerate(notes['entries']) if isinstance(x, dict) and x.get('name') == 'Pacing')
              notes['entries'].insert(pacing_index + 1, pacing_note)

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('**v1.5**', '**v1.6**', 1)
          if '## v1.6 refinements' not in readme:
              readme += '''\n\n## v1.6 refinements\n\n- Room 2 now uses Eye → Head → Hand clue cards on the DM screen with title-only book choices\n- Correct Room 2 choices place the matching symbols on the exit door; wrong choices reset the sequence\n- The ordinary handle in Room 3 is mixed into the door description rather than saved for the final detail\n- The Librarian opens with “State your authorization.”\n- Mirror Echoes visibly emerge from their source mirrors, making the discovered relationship legible\n- Final Reflections split directly from Josric and have no standing-mirror shortcut\n- Josric clearly states the final objective: “Final lesson. Defeat me.”\n- Recovery keeps its RAW spell explanation but adds faster table-running guidance\n- Designer’s Notes for Grayson now explain how to choose optional rooms based on both the clock and the table’s current energy\n'''
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit v1.6
        run: |
          git config user.name "sefjoe"
          git config user.email "109435369+sefjoe@users.noreply.github.com"
          git add Josric_Pickle_Practical_Course_for_Adventurers_5etools.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update adventure to v1.6"
          git push

name: Build 5eTools JSON

on:
  push:
    paths:
      - '.github/workflows/build-5etools-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild adventure JSON
        shell: bash
        run: |
          cat .build/payload.gz.b64.* | base64 --decode | gzip --decompress > Josric_Pickle_Practical_Course_for_Adventurers_5etools.json
          python -m json.tool Josric_Pickle_Practical_Course_for_Adventurers_5etools.json > /dev/null
          rm -rf .build

      - name: Commit generated JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add v1.4 5eTools adventure JSON"
            git push
          fi
